{% include 'layout/header.html' %}

{% include 'layout/sidebar.html' %}

<div class="main-content">
  <section class="section">
    <div class="section-header">
      <h1>Add User Data</h1>
    </div>

    <div class="section-body">

      <div class="row">
        <div class="col-12 col-md-12 col-lg-12">
          <form method="POST" action="">
            <div class="card-body">

              <div class="form-group">
                <label>Name</label>
                <input type="text" class="form-control" name="form_user_name" required>
              </div>

              <div class="form-group">
                <label>Age</label>
                <input type="text" class="form-control" name="form_user_age" required>
              </div>

              <div class="form-group">
                <label>Telp</label>
                <input type="text" class="form-control" name="form_user_telp" required>
              </div>

              <div class="form-group">
                <label>Address</label>
                <input type="text" class="form-control" name="form_user_address" required>
              </div>

              <div class="form-group">
                <label>Email</label>
                <input type="text" class="form-control" name="form_user_email" required>
              </div>

              <div class="form-group">
                <label>Role</label>
                <input type="text" class="form-control" name="form_user_role" required>
              </div>

              <div class="card-footer text-left">
                <input type="submit" value="Submit" class="btn btn-primary">
              </div>

            </div>
          </form>
        </div>
      </div>

    </div>
  </section>
</div>

{% include 'layout/footer.html' %}
