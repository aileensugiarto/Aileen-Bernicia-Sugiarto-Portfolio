{% include 'layout/header.html' %}

{% include 'layout/sidebar.html' %}

<div class="main-content">
  <section class="section">
    <div class="section-header">
      <h1>Edit User Data</h1>
    </div>

    <div class="section-body">

      <div class="row">
        <div class="col-12 col-md-12 col-lg-12">
          <div class="card">
            <form method="POST" action="/process_edit_user">
              <div class="card-body">

                <div class="form-group">
                  <input type="hidden" class="form-control" name="form_id_user" value="{{data_user[0]}}">
                  <label>Name</label>
                  <input type="text" class="form-control" name="form_user_name" required value="{{data_user[3]}}">
                </div>

                <div class="form-group">
                  <label>Age</label>
                  <input type="text" class="form-control" name="form_user_age" required value="{{data_user[4]}}">
                </div>

                <div class="form-group">
                  <label>Telp</label>
                  <input type="text" class="form-control" name="form_user_telp" required value="{{data_user[5]}}">
                </div>

                <div class="form-group">
                  <label>Address</label>
                  <input type="text" class="form-control" name="form_user_address" required value="{{data_user[6]}}">
                </div>

                <div class="form-group">
                  <label>Email</label>
                  <input type="text" class="form-control" name="form_user_email" required value="{{data_user[7]}}">
                </div>

                <div class="form-group">
                  <label>Role</label>
                  <input type="text" class="form-control" name="form_user_role" required value="{{data_user[8]}}">
                </div>

                <div class="card-footer text-left">
                  <input type="submit" value="Submit" class="btn btn-primary">
                </div>

              </div>
            </form>
          </div>
        </div>
      </div>

    </div>

  </section>
</div>

{% include 'layout/footer.html' %}
