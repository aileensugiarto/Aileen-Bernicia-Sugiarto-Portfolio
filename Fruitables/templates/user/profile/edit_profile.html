{% include 'user/seller/layout/header.html' %}

{% include 'user/seller/layout/sidebar.html' %}

<div class="main-content">
  <section class="section">
    <div class="section-header">
      <h1>Edit Profile</h1>
    </div>

    <div class="section-body">
      <div class="col-12 col-md-12 col-lg-12">
        <div class="card">
          <form method="POST" action="/process_edit_profile_seller" enctype="multipart/form-data">
            <div class="card-body">
              <!-- Hidden field to include the id_user -->
              <input type="hidden" name="form_id_user" value="{{ data_profile[0] }}">

              <div class="form-group">
                <label>Name</label>
                <input type="text" name="form_name" class="form-control" required value="{{data_profile[1]}}">
              </div>

              <div class="form-group">
                <label>Username</label>
                <input type="text" name="form_username" class="form-control" required value="{{data_profile[2]}}">
              </div>

              <div class="form-group">
                <label>Telp</label>
                <input type="text" name="form_telp" class="form-control" required value="{{data_profile[3]}}">
              </div>

              <div class="form-group">
                <label>Address</label>
                <input type="text" name="form_address" class="form-control" required value="{{data_profile[4]}}">
              </div>

              <div class="form-group">
                <label>Email</label>
                <input type="text" name="form_email" class="form-control" required value="{{data_profile[5]}}">
              </div>

              <div class="form-group">
                <label>Bio</label>
                <input type="text" name="form_bio" class="form-control" required value="{{data_profile[8]}}">
              </div>

              <div class="form-group">
                <label>Upload Image</label>
                <input type="file" name="form_profile_picture" class="form-control">
              </div>

              <div class="card-footer text-left">
                <input type="submit" value="Submit" class="btn btn-primary"></input>
              </div>
            </div>
          </form>

        </div>
      </div>
    </div>

  </section>
</div>

{% include 'user/seller/layout/footer.html' %}
