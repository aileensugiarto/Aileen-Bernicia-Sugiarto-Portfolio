<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
  <link rel="stylesheet" href="asset/css/bootstrap.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='frontend/asset/bootstrap/bootstrap.min.css') }}">
  <link rel="stylesheet"
    href="{{ url_for('static', filename='frontend/lib/owlcarousel/assets/owl.carousel.min.css') }}">

  <link rel="stylesheet" href="{{ url_for('static', filename='frontend/style.css') }}">
</head>

<body style="background-color: #F1F1F1;">
  <div class="container profile" style="background-color: white; box-shadow: 1px 2px 5px rgba(0, 0, 0, 0.1); margin-top: 100px; margin-bottom: 100px;">
    {% for row in data_profile %}
    <div class="row p-4">
      <div class="user-info mb-3"
        style="display: flex; flex-direction: column; justify-content: center; align-items: center;">

        <span style="color: black; font-size: 30px;">Profile</span>

        <div style="display: flex; justify-content: center; align-items: center; margin-top: 10px; margin-bottom: 70px;">
          <div style="height: 0.5px; background-color: black; width: 60px;"></div>
        </div>

        <!-- Profile Picture -->
        <img src="{{ url_for('static', filename='uploads/' + (row[8] if row[8] else 'default.png')) }}"
          style="width: 150px; height: 150px; object-fit: cover; border-radius: 100px; border: 5px solid #34395E;" alt="Product Image">

        <!-- Name -->
        <h3  style="margin-top: 25px; color: black;">{{ row[1] }}</h3>

        <!-- Items bought -->
        <p style="color: black;">Total Items Bought: <span style="font-weight: bold;">{{ row[9] }}</span></p>
      </div>

      <hr style="color: black;">

      <div class="mt-3 mb-3">
        <p>
          <i class="fa fa-phone" style="color: black;"></i>
          &nbsp;&nbsp;&nbsp;&nbsp;
          <span style="color: black;">{{ row[3] }}</span>
        </p>

        <p>
          <i class="fa fa-envelope" style="color: black;"></i>
          &nbsp;&nbsp;&nbsp;&nbsp;
          <span style="color: black;">{{ row[5] }}</span>
        </p>

        <p>
          <i class="fa fa-home" style="color: black;"></i>
          &nbsp;&nbsp;&nbsp;&nbsp;
          <span style="color: black;">{{ row[4] }}</span>
        </p>
      </div>

      <hr style="color: black;">

      <div class="mt-3">
        <div class="mb-2">
          <span style="color: black; font-size: 20px; font-weight: bold;">Biography</span>
        </div>
        <p style="color: #34395E;">{{ row[7] }}</p>
      </div>

      <a href="/edit_profile/{{row[0]}}" class="btn mt-3 edit-profile-btn">
        EDIT PROFILE
      </a>


    </div>


    {% endfor %}
  </div>

  <!-- Script -->
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.4/jquery.min.js"></script>
  <script src="{{ url_for('static', filename='frontend/asset/js/bootstrap.bundle.min.js') }}"></script>
  <script src="{{ url_for('static', filename='frontend/lib/owlcarousel/owl.carousel.min.js') }}"></script>
</body>

</html>
