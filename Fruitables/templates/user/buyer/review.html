<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reviews</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
  <link rel="stylesheet" href="asset/css/bootstrap.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='frontend/asset/bootstrap/bootstrap.min.css') }}">
  <link rel="stylesheet"
    href="{{ url_for('static', filename='frontend/lib/owlcarousel/assets/owl.carousel.min.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='frontend/style.css') }}">
</head>

<body style="background-color: #f6f6f6;">
  <!-- NAVBAR -->
  <nav class="navbar-shop navbar-expand-lg mt-5">
    <div class="container">
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#kumpulan">
        <span class="fa fa-bars text-black"></span>
      </button>

      <div class="collapse navbar-collapse text-light" id="kumpulan">
        <a href="/buyer_home">
          <img src="../../../static/uploads/logo.png" alt="" width="100px" style="border-radius: 50px;">
        </a>
        <ul class="navbar-nav mx-auto">
          <li class="nav-item"><a href="/buyer_home" class="nav-link">HOME</a></li>
          <li class="nav-item"><a href="/about_us" class="nav-link">ABOUT US</a></li>
          <li class="nav-item"><a href="/shop_all" class="nav-link">SHOP</a></li>
          <li class="nav-item"><a href="/reviews" class="nav-link">REVIEWS</a></li>
          <li class="nav-item"><a href="/order/{{session['id_user']}}" class="nav-link">ORDER STATUS</a></li>
        </ul>
        <ul class="navbar-nav navbar-right">
          <a href="#" class="position-relative me-4 my-auto" data-bs-toggle="collapse" data-bs-target="#search-form">
            <i class="fa fa-search" style="color: #28A745;"></i>
          </a>
          <div class="collapse" id="search-form">
            <form action="{{url_for('search_results')}}" method="GET" class="d-flex">
              <input type="text" name="query" class="form-control" placeholder="Search for products" required style="border-radius: 0;">
              <button type="submit" class="btn btn-success" style="border-radius: 0;">Search</button>
            </form>
          </div>

          <a href="/cart/{{session['id_user']}}" class="position-relative me-4 my-auto">
            <i class="fa fa-shopping-bag" style="color: #28A745;"></i>
          </a>
          <li class="dropdown">
            <a href="#" data-bs-toggle="dropdown" class="nav-link dropdown-toggle nav-link-lg nav-link-user">
              <div class="d-sm-none d-lg-inline-block" style="font-size: 16.5px; color: black;">Hi, {{session.name}}</div>
            </a>
            <div class="dropdown-menu dropdown-menu-right">
              <a href="/profile" class="dropdown-item has-icon">
                <i class="far fa-user"></i> Profile
              </a>
              <div class="dropdown-divider"></div>
              <a href="/logout" class="dropdown-item has-icon text-danger">
                <i class="fas fa-sign-out-alt"></i> Logout
              </a>
            </div>
          </li>
        </ul>

      </div>
    </div>
  </nav>
  <!-- NAVBAR END -->

  <!-- REVIEWS -->
  <section class="mt-5 reviews">
    <div class="container">
      <div class="text-center">
        <span style="color: black; font-size: 40px;">Reviews</span>
        <div
          style="display: flex; justify-content: center; align-items: center; margin-top: 20px; margin-bottom: 70px;">
          <div style="height: 0.5px; background-color: black; width: 75px;"></div>
        </div>
      </div>

      <div class="mb-3">
        <a href="{{ url_for('write_review') }}" class="btn write-review-btn">WRITE A REVIEW</a>
      </div>

      <div class="row">
        {% for row in data_reviews %}
        <div class="col-md-12 col-lg-6 col-xl-4 mb-4">
          <div class="card p-3">
            <div class="card-body">
              <div class="stars mb-2">
                {% for i in range(1, 6) %}
                <i class="fa fa-star {% if i <= row[2] %}filled{% else %}empty{% endif %}"></i>
                {% endfor %}
              </div>

              <p class="card-text" style="color: #34395E;">{{ row[1] }}</p>

              <div class="row">
                <div class="col-3">
                  <img src="{{ url_for('static', filename='uploads/' + (row[4] if row[4] else 'default.png')) }}"
                    alt="Profile Picture" class="profile-img" width="100%" style="border-radius: 50%;">
                </div>
                <div class="col-9 d-flex align-items-center">
                  <!-- Added d-flex and align-items-center here -->
                  <span class="card-title" style="color: black; font-size: 20px; font-weight: bold;">
                    {{ row[3] }}
                  </span>
                </div>
              </div>

            </div>
          </div>
        </div>
        {% endfor %}
      </div>
    </div>
  </section>
  <!-- REVIEWS END -->

  <footer class="main-footer">
    <div class="footer-container">
      <div class="footer-left">
        Copyright &copy; 2025 Fruitables
      </div>
      <div class="footer-right">
      </div>
    </div>
  </footer>

  <!-- Script -->
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.4/jquery.min.js"></script>
  <script src="{{ url_for('static', filename='frontend/asset/js/bootstrap.bundle.min.js') }}"></script>
  <script src="{{ url_for('static', filename='frontend/lib/owlcarousel/owl.carousel.min.js') }}"></script>
</body>

</html>
